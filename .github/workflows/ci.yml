name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install --no-deps -e .

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install browser test dependencies
      run: |
        npm ci --ignore-scripts
        python -m playwright install --with-deps chromium

    - name: Lint with Black
      run: |
        black --check .

    - name: Lint with Flake8
      run: flake8 .

    - name: Type check with Mypy
      run: |
        mypy cleaning scraper visualization *.py --ignore-missing-imports

    - name: Test with pytest
      run: pytest --run-browser --cov --cov-report=term-missing

  wheel-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in an isolated environment and exercise public commands
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="$RUNNER_TEMP/wheel-env/Scripts"
          else
            BIN="$RUNNER_TEMP/wheel-env/bin"
          fi
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/python" -m pip check
          mkdir "$RUNNER_TEMP/wheel-work"
          cp scripts/wheel_smoke.py "$RUNNER_TEMP/wheel-work/smoke.py"
          cd "$RUNNER_TEMP/wheel-work"
          PATH="$BIN:$PATH" "$BIN/python" -I smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
