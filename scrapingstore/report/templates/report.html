<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrapingStore report</title>
<meta name="description" content="Product prices and stock across collection runs, generated by ScrapingStore {{ version }}.">
<meta name="generator" content="ScrapingStore {{ version }}">
<script>
  try {
    var savedTheme = localStorage.getItem('scrapingstore-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
  } catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --hair: #e1e0d9;
  --line: #c3c2b7;
  --band: #ebeae4;
  --row-hover: #f3f3f0;
  --drop: #2a78d6;
  --rise: #e34948;
  --warn: #c98500;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --hair: #2c2c2a;
    --line: #4a4a46;
    --band: #303030;
    --row-hover: #222221;
    --drop: #3987e5;
    --rise: #e66767;
    --warn: #fab219;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a19;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --hair: #2c2c2a;
  --line: #4a4a46;
  --band: #303030;
  --row-hover: #222221;
  --drop: #3987e5;
  --rise: #e66767;
  --warn: #fab219;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
code { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

.top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
  padding: 20px 0; color: var(--ink-2);
}
.top .brand { font-weight: 600; color: var(--ink); white-space: nowrap; }
.top .scope { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

h1.lede {
  margin: 48px 0 0; max-width: 28em;
  font-size: 30px; line-height: 1.32; font-weight: 400; letter-spacing: -0.012em;
  text-wrap: pretty;
}
.lede button {
  background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; text-align: left;
  text-decoration: underline; text-decoration-color: var(--hair);
  text-decoration-thickness: 2px; text-underline-offset: 5px;
}
.lede button:hover { text-decoration-color: var(--ink-2); }
.lede button[aria-pressed="true"] { text-decoration-color: var(--ink); }
.tri { display: inline-block; font-size: 0.42em; vertical-align: 0.42em; margin-right: 0.28em; }
.dn { color: var(--drop); }
.up { color: var(--rise); }
.facts { margin: 16px 0 0; color: var(--ink-2); font-size: 15px; }
.empty p { color: var(--ink-2); font-size: 15px; }

.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px;
  margin: 56px 0 0; padding-bottom: 14px;
}
.status { flex: 1 1 280px; color: var(--ink-2); }
.status strong { color: var(--ink); font-weight: 600; }
.linkbtn {
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
  text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px;
}
.linkbtn:hover { text-decoration-color: var(--ink); }
.search {
  width: 240px; height: 32px; padding: 0 10px; border-radius: 6px;
  border: 1px solid var(--hair); background: var(--bg);
}
select { height: 32px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--hair); background: var(--bg); }
.search:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--drop); outline-offset: 1px; }

.legend {
  display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0 0 6px;
  color: var(--ink-2); font-size: 12.5px;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { font-style: normal; font-size: 9px; }
.sw-band { width: 26px; height: 12px; border-radius: 6px; background: var(--band); }
.sw-line { width: 26px; height: 1px; background: var(--line); }

/* Scrolls sideways only when the runs don't fit, so the header stays sticky otherwise. */
.tablewrap.scroll { overflow-x: auto; }
table.grid {
  width: 100%; border-collapse: separate; border-spacing: 0;
  table-layout: fixed; font-variant-numeric: tabular-nums;
}
.grid th {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  font-weight: 500; font-size: 13px; color: var(--ink-2);
  padding: 10px 0 8px; border-bottom: 1px solid var(--hair);
  text-align: center; vertical-align: bottom; white-space: nowrap;
}
.grid th.latest { color: var(--ink); font-weight: 600; }
.grid th .sub { display: block; font-size: 11.5px; font-weight: 400; color: var(--ink-2); }
.grid th .sub::before { content: "\26A0\FE0E"; color: var(--warn); margin-right: 3px; }
.grid th.name, .grid td.name {
  position: sticky; left: 0; text-align: left; background: var(--bg);
  padding-right: 16px; overflow: hidden; white-space: nowrap;
}
.grid th.name { z-index: 3; }
.grid th.chg, .grid td.chg { text-align: right; padding-right: 2px; }
.grid td { padding: 0; height: 34px; }
.grid tbody tr:hover td { background: var(--row-hover); }
td.name .nm { display: flex; min-width: 0; }
td.name .nm > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
td.name a:hover { text-decoration: underline; }
td.name .note { flex: none; color: var(--muted); margin-left: 8px; }

.t { display: flex; align-items: center; height: 22px; font-size: 13px; color: var(--ink-2); }
.t::before, .t::after { content: ""; flex: 1 1 0; height: 1px; }
.t.l::before, .t.r::after { background: var(--line); }
.t .v { padding: 0 7px; white-space: nowrap; }
.t.ch .v { color: var(--ink); font-weight: 600; }
.t.cur .v { color: var(--ink); }
.t.unk .v { color: var(--muted); }
.t .v i, td.chg i { font-style: normal; font-size: 8px; vertical-align: 2px; margin-right: 3px; }
.t .v i.gap { font-size: 10px; vertical-align: 1px; }
.t.oos { background: var(--band); }
.t.oos-s { border-top-left-radius: 11px; border-bottom-left-radius: 11px; }
.t.oos-e { border-top-right-radius: 11px; border-bottom-right-radius: 11px; }
td.chg { font-size: 13px; color: var(--ink); }
td.chg .flat { color: var(--muted); }
.more { margin: 14px 0 0; display: flex; gap: 20px; flex-wrap: wrap; }
.nomatch { padding: 32px 0; color: var(--ink-2); }

.lower {
  display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 64px;
  margin: 80px 0 0; padding-top: 28px; border-top: 1px solid var(--hair);
}
.lower.single { grid-template-columns: minmax(0, 1fr); }
h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
.overview {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 48px;
  margin: 52px 0 0;
}
figure.chart { margin: 0; min-width: 0; }
.overview figure.chart { display: flex; flex-direction: column; }
.overview .plot { margin-top: auto; }
figure.chart h2 { font-size: 15px; margin: 0 0 6px; }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 10px; font-size: 12px; color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; box-sizing: border-box; }
.key .sw.hollow { border: 1.5px solid var(--ink-2); }
.key .sw.dot { border-radius: 50%; background: var(--ink-2); }
.key .sw.dot.hollow { background: transparent; }
.key .sw.tick { width: 2px; height: 12px; border-radius: 0; background: var(--ink); }
.plot { display: block; width: 100%; height: auto; overflow: visible; }
.plot text { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.plot text.lbl { fill: var(--ink-2); }
.plot text.val { fill: var(--ink); font-weight: 600; font-size: 12.5px; }
.plot text.cat { fill: var(--ink); font-size: 13px; }
.plot text.cat .cnt { fill: var(--muted); font-size: 12px; }
.plot .zero, .plot .axis { stroke: var(--line); stroke-width: 1; }
.plot .gl, .plot .row { stroke: var(--hair); stroke-width: 1; }
.plot rect.band { fill: var(--row-hover); opacity: 0; }
.plot rect.band.on { opacity: 1; }
.plot .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.plot .pt { fill: var(--ink); stroke: var(--bg); stroke-width: 2; }
.plot .pt.hollow { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.plot .area-up { fill: var(--rise); fill-opacity: .13; }
.plot .area-dn { fill: var(--drop); fill-opacity: .13; }
.plot .b-up { fill: var(--rise); }
.plot .b-dn { fill: var(--drop); }
.plot .b-up.gap { fill: none; stroke: var(--rise); stroke-width: 1.5; }
.plot .b-dn.gap { fill: none; stroke: var(--drop); stroke-width: 1.5; }
.plot .b-in, .plot .b-done { fill: var(--ink-2); }
.plot .b-out { fill: var(--line); }
.plot .b-unk { fill: var(--hair); }
.plot .b-open { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.plot .dot { fill: var(--ink-2); stroke: var(--bg); stroke-width: 1.5; }
.plot .dot.out { fill: var(--bg); stroke: var(--ink-2); stroke-width: 1.5; }
.plot .dot.dim { fill: var(--hair); }
.plot .dot.out.dim { fill: var(--bg); stroke: var(--hair); }
.plot .med { stroke: var(--ink); stroke-width: 2; }
.plot .medall { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.side { display: flex; flex-direction: column; gap: 48px; min-width: 0; }
.aside { color: var(--ink-2); margin: 12px 0 0; }
ul.notes { margin: 0; padding: 0; list-style: none; }
ul.notes li { padding: 0 0 12px; color: var(--ink-2); }
ul.notes li strong { color: var(--ink); font-weight: 600; }

footer {
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  margin: 72px 0 0; padding: 18px 0 40px; border-top: 1px solid var(--hair);
  color: var(--muted); font-size: 13px;
}
footer .linkbtn { color: var(--ink-2); }

#tip {
  position: fixed; z-index: 10; pointer-events: none; display: none;
  max-width: 320px; padding: 8px 10px; border-radius: 6px;
  background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.4;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .18);
}
#tip b { font-weight: 600; }

@media (max-width: 1000px) {
  .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .overview { grid-template-columns: minmax(0, 1fr); gap: 36px; margin-top: 36px; }
  h1.lede { font-size: 23px; margin-top: 28px; }
  .lower { grid-template-columns: minmax(0, 1fr); gap: 40px; }
  .search { flex: 1 1 100%; width: auto; }
  .controls { margin-top: 36px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">ScrapingStore</span>
    <span class="scope" id="scope"></span>
  </header>

  <section class="empty"{% if timeline.rows %} hidden{% endif %}>
    <h1 class="lede">No data yet.</h1>
    <p>Run <code>scrapingstore demo</code> to see a simulated store, or <code>scrapingstore scrape</code> to collect real products.</p>
  </section>

  <main id="report"{% if not timeline.rows %} hidden{% endif %}>
    <h1 class="lede" id="lede"></h1>
    <p class="facts" id="facts"></p>
    <noscript><p class="facts">This report needs JavaScript to draw the product table.</p></noscript>

    <section class="overview" id="overview" hidden>
      <figure class="chart">
        <h2 id="index-title">Prices</h2>
        <svg class="plot" id="chart-index" role="img" aria-label="Typical price change since the first run"></svg>
      </figure>
      <figure class="chart">
        <h2 id="changes-title">Price changes</h2>
        <div class="key" id="changes-key" aria-hidden="true"></div>
        <svg class="plot" id="chart-changes" role="img" aria-label="Price drops and rises in each run"></svg>
      </figure>
      <figure class="chart">
        <h2 id="stock-title">Stock</h2>
        <div class="key" id="stock-key" aria-hidden="true"></div>
        <svg class="plot" id="chart-stock" role="img" aria-label="Products in stock and sold out in each run"></svg>
      </figure>
    </section>

    <div class="controls">
      <div class="status" id="status" aria-live="polite"></div>
      <input class="search" id="q" type="search" placeholder="Search products  /" aria-label="Search products" autocomplete="off">
      <select id="sort" aria-label="Sort products">
        <option value="latest">Latest changes first</option>
        <option value="drop">Biggest drop</option>
        <option value="rise">Biggest rise</option>
        <option value="price">Price, high to low</option>
        <option value="name">Name</option>
      </select>
      <button class="linkbtn" id="csv" type="button" aria-label="Export matching products as CSV">Download CSV</button>
    </div>
    <div class="legend" id="legend" aria-hidden="true"></div>
    <div class="tablewrap" id="tablewrap">
      <table class="grid" id="grid"></table>
    </div>
    <div class="more" id="more"></div>

    <section class="lower" id="lower">
      <figure class="chart" id="prices">
        <h2 id="prices-title">Prices</h2>
        <div class="key" id="prices-key" aria-hidden="true"></div>
        <svg class="plot" id="chart-prices" role="img" aria-label="Current prices by category"></svg>
        <p class="aside" id="prices-aside"></p>
      </figure>
      <div class="side" id="side">
        <figure class="chart" id="restock" hidden>
          <h2 id="restock-title">Restocks</h2>
          <div class="key" id="restock-key" aria-hidden="true"></div>
          <svg class="plot" id="chart-restock" role="img" aria-label="How long products stayed sold out"></svg>
        </figure>
        <div id="notes-wrap">
          <h2>Notes</h2>
          <ul class="notes" id="notes"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span id="generated">Generated {{ timestamp }} UTC · ScrapingStore {{ version }}</span>
    <button class="linkbtn" id="theme" type="button">Switch theme</button>
  </footer>
</div>
<div id="tip" role="tooltip"></div>

<script id="timeline-data" type="application/json">{{ timeline | tojson }}</script>
<script id="columnar-data" type="application/json">{{ columnar | tojson }}</script>
<script id="statistics-data" type="application/json">{{ statistics | tojson }}</script>
<script id="smells-data" type="application/json">{{ smells | tojson }}</script>
<script id="restock-data" type="application/json">{{ restock_analysis | tojson }}</script>
<script id="report-metadata" type="application/json">{{ {"version": version, "scope": scope, "generated_at": generated_iso, "collection_label": collection_label, "latest_collection": last_run, "freshness": freshness, "observation_period": observation_period, "health_score": health_score, "coverage": coverage} | tojson }}</script>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function readJson(id) {
    var el = $(id);
    try { return el ? JSON.parse(el.textContent) : null; } catch (e) { return null; }
  }
  function decodeColumnar(bundle) {
    if (!bundle || !bundle.n) return [];
    var rows = [];
    for (var i = 0; i < bundle.n; i++) rows.push({});
    (bundle.schema || []).forEach(function (col) {
      var spec = bundle.cols[col];
      if (spec && !Array.isArray(spec) && typeof spec === 'object' && 'const' in spec) {
        rows.forEach(function (r) { r[col] = spec.const; });
      } else if (bundle.dicts && bundle.dicts[col]) {
        var table = bundle.dicts[col];
        (spec || []).forEach(function (ix, k) { rows[k][col] = table[ix]; });
      } else {
        (spec || []).forEach(function (v, k) { rows[k][col] = v; });
      }
    });
    return rows;
  }
  // Dates are shown in UTC with fixed month names, so every viewer reads the same labels.
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dateShort(iso) { if (!iso) return 'Latest'; var d = new Date(iso); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; }
  function dateLong(iso) { return iso ? dateShort(iso) + ' ' + new Date(iso).getUTCFullYear() : 'unknown date'; }
  function timeShort(iso) { if (!iso) return ''; var d = new Date(iso); return pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes()); }
  function money(v, currency) { return currency && currency !== 'EUR' ? v.toFixed(2) + ' ' + currency : '€' + v.toFixed(2); }
  function axisMoney(v) { return mainCurrency === 'EUR' ? '€' + v : v + ' ' + mainCurrency; }
  function round2(v) { return Math.round(v * 100) / 100; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function plural(n, one, many) { return n === 1 ? one : many; }
  function joinAnd(parts) { return parts.length < 2 ? parts.join('') : parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1]; }
  function median(sorted) { var n = sorted.length; return n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2; }
  function quantile(sorted, q) { var pos = (sorted.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos); return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo); }
  function isHttp(url) { return typeof url === 'string' && /^https?:\/\//i.test(url); }
  var GLYPH = { down: '&#9660;', up: '&#9650;', down_gap: '&#9661;', up_gap: '&#9651;' };

  var T = readJson('timeline-data') || { runs: [], rows: [], latest: null };
  var META = readJson('report-metadata') || {};
  var RESTOCK = readJson('restock-data');
  var SMELLS = readJson('smells-data') || [];
  var CATALOG = decodeColumnar(readJson('columnar-data'));

  /* ---------- theme ---------- */
  $('theme').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('scrapingstore-theme', root.dataset.theme); } catch (e) {}
  });

  var scopeText = META.scope && META.scope !== 'Current stored catalog' ? META.scope : '';
  if (!scopeText) {
    var withUrl = T.rows.filter(function (r) { return isHttp(r.url); });
    var hosts = Array.from(new Set(withUrl.map(function (r) { return new URL(r.url).host; })));
    scopeText = hosts.length === 1 ? hosts[0] : hosts.length > 1 ? hosts.length + ' sources' : '';
  }
  $('scope').textContent = scopeText;

  if (!T.rows.length) return;

  /* ---------- model ---------- */
  var runs = T.runs;
  var L = runs.length - 1;
  var multi = runs.length > 1;
  var latestDate = runs[L].started_at;

  var rows = T.rows.map(function (r, idx) {
    var events = 0, firstPrice = null, gaps = 0;
    r.cells.forEach(function (c) {
      if (!c) return;
      if (c[2] || c[3]) events++;
      if (c[2] === 'down_gap' || c[2] === 'up_gap') gaps++;
      if (c[0] != null && firstPrice == null) firstPrice = c[0];
    });
    var now = r.last === L ? r.cells[L] : null;
    var strong = multi && r.comparable;
    var ev = {
      drop: !!now && now[2] === 'down',
      rise: !!now && now[2] === 'up',
      back: !!now && now[3] === 'back',
      out: !!now && now[3] === 'out',
      added: strong && r.first === L,
      unseen: strong && r.last === L - 1,
    };
    var lastPrice = now && now[0] != null ? now[0] : null;
    var latestEvent = Object.keys(ev).some(function (k) { return ev[k]; }) || (!!now && !!now[2]);
    return {
      key: r.key, name: r.name, category: r.category || '', url: r.url, currency: r.currency || 'EUR',
      cells: r.cells, first: r.first, last: r.last, comparable: r.comparable, mixed: r.mixed_currency,
      lastSeen: r.last_seen, idx: idx, ev: ev, gaps: gaps, latestEvent: latestEvent,
      activity: events + (strong && r.first > 0 ? 1 : 0) + (strong && r.last != null && r.last < L ? 1 : 0),
      lastPrice: lastPrice,
      change: r.comparable && !r.mixed_currency && lastPrice != null && firstPrice != null ? round2(lastPrice - firstPrice) : null,
      text: (r.name + ' ' + (r.category || '')).toLowerCase(),
    };
  });
  var seenNow = rows.filter(function (r) { return r.last === L; });
  // Price summaries use the currency most current prices are in; others can't share a scale.
  var mainCurrency = (function () {
    var counts = {}, best = 'EUR', bestN = 0;
    seenNow.forEach(function (r) { if (r.lastPrice != null) counts[r.currency] = (counts[r.currency] || 0) + 1; });
    Object.keys(counts).sort().forEach(function (c) { if (counts[c] > bestN) { best = c; bestN = counts[c]; } });
    return best;
  })();
  var pricedNow = seenNow.filter(function (r) { return r.lastPrice != null && r.currency === mainCurrency; });
  var gapTotal = rows.reduce(function (n, r) { return n + r.gaps; }, 0);
  var runLabels = (function () {
    var labels = runs.map(function (r) { return dateShort(r.started_at); });
    var dupes = labels.some(function (l, i) { return labels.indexOf(l) !== i; });

  /* ---------- charts ---------- */

  function drawIndex() {
    var svg = $('chart-index'), W = plotWidth(svg), H = 160, top = PAD.t, bottom = H - PAD.b;

  }

  function drawChanges() {

  function drawStock() {
    var svg = $('chart-stock'), W = plotWidth(svg), H = 160, top = PAD.t, bottom = H - PAD.b;
    var max = Math.max.apply(null, STOCK.map(function (st) { return st.inStock + st.soldOut + st.unknown; })) || 1;

  var priceDots = [];
  function drawCategories(active) {

    var byCat = {};

    var cats = Object.keys(byCat).sort(function (a, b) { return byCat[b].length - byCat[a].length || a.localeCompare(b); });
    if (cats.length > 10) {

    var minP = Math.min.apply(null, main.map(function (r) { return r.lastPrice; }));
    var maxP = Math.max.apply(null, main.map(function (r) { return r.lastPrice; }));
    var tick = niceStep(Math.max(maxP - minP, 1), W < 520 ? 4 : 6, [0.5, 1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000, 50000]);
    var lo = Math.floor(minP / tick) * tick, hi = Math.ceil(maxP / tick) * tick;

    var filtering = !!(state.ev || state.q.trim());

        })[0];

      var spread = placed.reduce(function (m, p) { return Math.max(m, Math.abs(p.y)); }, 0);

  /* ---------- how long products stayed sold out ---------- */

    var steps = function (d) { return Math.min(CAP, Math.max(0, Math.round(d / g))); };

    done.forEach(function (d) { restockBins[steps(d)].done++; });

      qEl.value = ''; state.q = ''; state.ev = null; state.limit = PAGE; qEl.blur(); render();
    }
  });
  var resizeTimer;
  function drawAll() { drawOverview(); drawRestock(); render(); }
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawAll, 120); });

  drawAll();
})();
</script>
