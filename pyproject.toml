[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapingstore"
version = "3.0.0"
description = "Collect product prices and stock across repeated runs, keep every run in SQLite, and build an offline HTML report of what changed."
authors = [
    {name = "Simone"},
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "playwright==1.60.0",
    "jinja2>=3.1.0",
    "sqlmodel>=0.0.14",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
scrapingstore = "scrapingstore.cli.app:app"

[project.optional-dependencies]
pandas = [
    "pandas>=2.0,<3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "hypothesis>=6.100",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "pre-commit",
    "types-requests",
    "types-beautifulsoup4",
    "pandas>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["scrapingstore*"]
exclude = ["data*", "assets*", "tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"scrapingstore.report" = ["templates/*.html"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["data", "docs", ".venv", "node_modules", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::ResourceWarning",
]

[tool.coverage.run]
source = ["scrapingstore"]
